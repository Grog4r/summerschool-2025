[project]
name = "summerschool-2025"
version = "0.1.0"
description = "Summerschool 2025 labs with FastAPI backend and Streamlit UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "streamlit>=1.31",
  "ruff>=0.5",
  "openai>=1.106.1",
  "python-dotenv>=1.1.1",
  "haystack-ai>=2.17.1",
  "qdrant-haystack>=9.2.0",
  "python-docx>=1.2.0",
  "trafilatura>=2.0.0",
  "pypdf>=6.0.0",
  "python-pptx>=1.0.2",
  "pandas>=2.3.2",
  "openpyxl>=3.1.5",
  "markdown-it-py>=4.0.0",
  "mdit-plain>=1.0.1",
  "nltk>=3.9.1",
  "sentence-transformers>=4.1.0",
  "cryptography>=3.1",
  "unidecode>=1.4.0",
  "fastembed-haystack>=1.5.0",
]

[tool.uv]
package = false
